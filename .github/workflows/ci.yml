name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          # Keep the differential oracle aligned with COMPATIBILITY_STRATEGY.md
          # and the benchmark environment. Patch releases can change observable
          # behavior, as happened with util.parseEnv between 22.15 and 22.23.
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: fixtures/express-basic/package-lock.json
      - run: npm ci
        working-directory: fixtures/express-basic
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo xtask compat run
      - run: cargo test --test runtime_smoke -- --ignored
