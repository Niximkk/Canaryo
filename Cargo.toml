[package]
name = "canaryo"
version = "0.1.0"
edition = "2024"
description = "A compatibility-first JavaScript runtime for existing Node.js HTTP applications."
license = "MIT"

[[bin]]
name = "canaryo"
path = "src/main.rs"

[[bench]]
name = "runtime"
harness = false

[dependencies]
base64 = "0.22"
mio = { version = "1.2", features = ["net", "os-poll"] }
rquickjs = { version = "0.12.2", features = ["loader"] }
serde_json = "1"
sha1 = "0.10"
