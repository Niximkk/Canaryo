[package]
name = "canaryo"
version = "0.1.0"
edition = "2024"
description = "A compatibility-first JavaScript runtime for existing Node.js HTTP applications."
license = "MIT"
default-run = "canaryo"

[[bin]]
name = "canaryo"
path = "src/main.rs"

[[bin]]
name = "xtask"
path = "src/bin/xtask.rs"

[[bench]]
name = "runtime"
harness = false

[dependencies]
base64 = "0.22"
brotli = "8"
flate2 = "1.1"
mio = { version = "1.2", features = ["net", "os-poll"] }
rquickjs = { version = "0.12.2", features = ["loader"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
subtle = "2.6"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
