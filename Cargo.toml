[package]
name = "canaryo"
version = "0.2.0"
edition = "2024"
description = "A Rust and QuickJS proof of concept for running existing Express applications."
license = "MIT"
repository = "https://github.com/Niximkk/Canaryo"
readme = "README.md"
keywords = ["javascript", "runtime", "express", "quickjs"]
categories = ["command-line-utilities", "development-tools"]
default-run = "canaryo"

[[bin]]
name = "canaryo"
path = "src/main.rs"

[[bin]]
name = "xtask"
path = "src/bin/xtask.rs"

[[bench]]
name = "runtime"
harness = false

[dependencies]
base64 = "0.22"
brotli = "8"
flate2 = "1.1"
mio = { version = "1.2", features = ["net", "os-poll"] }
rquickjs = { version = "0.12.2", features = ["loader"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
subtle = "2.6"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
